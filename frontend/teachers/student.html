<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareStance | Student profile</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');:root{--ink:#241c3d;--muted:#817b9c;--purple:#7153ee;--tint:#f0edff;--bg:#f5f3fc;--card:#fff;--border:#eae6f8;--green:#16895b;--amber:#b97809}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}main{max-width:1180px;margin:auto;padding:32px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.back{color:var(--purple);font-weight:700;text-decoration:none}h1{font:700 28px Poppins,sans-serif;margin:4px 0}p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border-radius:18px;padding:22px;border:1px solid var(--border);box-shadow:0 4px 18px #6e4ac10d}.wide{grid-column:1/-1}h2{font:700 16px Poppins,sans-serif;margin:0 0 14px}.items{display:grid;gap:10px}.item{padding:12px;border-radius:10px;background:#faf9fe;font-size:13px}.item b{display:block;margin-bottom:5px}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--tint);color:var(--purple);font-size:11px;font-weight:700;margin:3px 3px 0 0}.progress{height:8px;background:#eeeafb;border-radius:8px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--purple)}textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:10px;padding:10px;font:13px Inter}button{border:0;background:var(--purple);color:#fff;font:700 13px Inter;padding:10px 14px;border-radius:10px;cursor:pointer;margin-top:8px}.error{color:#b52b47;font-weight:600}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main><div class="top"><a class="back" href="Students.html">← Back to students</a><button id="logout">Log out</button></div><section class="card" id="header"><h1>Loading student…</h1></section><div class="grid" id="content" hidden>
<section class="card"><h2>Assessment scores</h2><div class="items" id="assessments"></div></section><section class="card"><h2>Career interests</h2><div class="items" id="interests"></div><h2 style="margin-top:18px">Simulation history</h2><div class="items" id="simulations"></div></section>
<section class="card"><h2>Skill-gap analysis</h2><div class="items" id="skills"></div></section><section class="card"><h2>Growth roadmap</h2><div class="items" id="roadmap"></div><h2 style="margin-top:18px">Tasks</h2><div id="tasks"></div></section>
<section class="card wide"><h2>Teacher notes</h2><form id="noteForm"><textarea id="note" maxlength="1000" placeholder="Add an actionable academic/development note…"></textarea><br><button>Save note</button></form><div class="items" id="notes" style="margin-top:14px"></div></section>
<section class="card wide"><h2>Progress timeline</h2><div class="items" id="timeline"></div></section></div></main><script>
const api=location.protocol==='file:'?'http://localhost:3000':'';const auth=JSON.parse(sessionStorage.getItem('carestanceAuth')||'null');const id=new URLSearchParams(location.search).get('id');const $=s=>document.querySelector(s);const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!auth?.token||!id)location.replace(location.protocol==='file:'?'../login.html':'/login.html');let profile;function list(selector,rows,fn){$(selector).innerHTML=rows.length?rows.map(fn).join(''):'<div class="item">No data available yet.</div>'}function render(d){profile=d;$('#header').innerHTML=`<h1>${esc(d.student.name)}</h1><p>${esc(d.student.className)} · Academic and development information only</p>`;$('#content').hidden=false;list('#assessments',d.assessments,x=>`<div class="item"><b>${esc(x.title)}</b>${x.status==='completed'?`Score: ${esc(x.score)}%`:'In progress'}</div>`);list('#interests',d.careerInterests,x=>`<div class="item"><span class="tag">${esc(x.career_area)}</span></div>`);list('#simulations',d.simulations,x=>`<div class="item"><b>${esc(x.simulation_name)}</b>${esc(x.result_summary)}</div>`);list('#skills',d.skillGaps,x=>`<div class="item"><b>${esc(x.skill_name)}</b>${esc(x.current_level)} → ${esc(x.target_level)}<br><small>${esc(x.recommended_action)}</small></div>`);list('#roadmap',d.roadmap,x=>`<div class="item"><b>${esc(x.title)} — ${Math.round(x.progress_percent)}%</b><div class="progress"><i style="width:${Math.round(x.progress_percent)}%"></i></div></div>`);$('#tasks').innerHTML=`<span class="tag">Completed: ${d.tasks.completed.length}</span><span class="tag">Pending: ${d.tasks.pending.length}</span>`;list('#notes',d.notes,x=>`<div class="item"><b>${esc(x.author)}</b>${esc(x.note)}</div>`);list('#timeline',d.timeline,x=>`<div class="item">${esc(x.activity_type.replaceAll('_',' '))} <small>· ${new Date(x.occurred_at).toLocaleDateString()}</small></div>`)}async function load(){try{const r=await fetch(`${api}/api/v1/teacher/students/${id}`,{headers:{Authorization:`Bearer ${auth.token}`}});const b=await r.json();if(!r.ok)throw Error(b.error);render(b.data)}catch(e){$('#header').innerHTML=`<p class="error">${esc(e.message)}</p>`}}$('#noteForm').addEventListener('submit',async e=>{e.preventDefault();const note=$('#note').value.trim();if(!note)return;const r=await fetch(`${api}/api/v1/teacher/students/${id}/notes`,{method:'POST',headers:{Authorization:`Bearer ${auth.token}`,'content-type':'application/json'},body:JSON.stringify({note})});if(r.ok){$('#note').value='';load()}});$('#logout').onclick=()=>{sessionStorage.removeItem('carestanceAuth');location.href=location.protocol==='file:'?'../login.html':'/login.html'};load();
</script></body></html>
