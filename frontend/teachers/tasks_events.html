<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareStance | Tasks & Events</title><style>body{margin:0;background:#f5f3fc;color:#241c3d;font:14px Inter,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center}a{color:#7153ee;font-weight:700;text-decoration:none}h1{margin:8px 0}p{color:#817b9c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #eae6f8;border-radius:16px;padding:20px;margin-top:16px}.list{display:grid;gap:10px}.item{background:#faf9fe;border-radius:10px;padding:12px}.item b{display:block;margin-bottom:4px}input,select{border:1px solid #dcd6f3;border-radius:8px;padding:10px;font:inherit;width:100%;margin:5px 0}button{border:0;border-radius:8px;background:#7153ee;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer;margin-top:5px}.error{color:#b52b47}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><a href="dashboard.html">← Dashboard</a><button id="logout">Log out</button></div><h1>Tasks & Events</h1><p>Create and monitor work for your selected class.</p><section class="card"><label>Class <select id="classSelect"></select></label></section><div class="grid"><section class="card"><h2>Assign a task</h2><form id="taskForm"><input id="taskTitle" maxlength="160" placeholder="Task title" required><select id="taskType"><option value="weekly_goal">Weekly goal</option><option value="practice">Practice</option><option value="project">Project</option></select><input id="taskDue" type="datetime-local" required><button>Assign task</button></form></section><section class="card"><h2>Create an event</h2><form id="eventForm"><input id="eventTitle" maxlength="160" placeholder="Event title" required><select id="eventType"><option value="session">Class session</option><option value="review">Review</option><option value="reminder">Reminder</option></select><input id="eventStart" type="datetime-local" required><button>Create event</button></form></section></div><p id="error" class="error"></p><div class="grid"><section class="card"><h2>Assigned tasks</h2><div id="tasks" class="list"></div></section><section class="card"><h2>Upcoming events</h2><div id="events" class="list"></div></section></div></main><script>const api=location.protocol==='file:'?'http://localhost:3000':'';const auth=JSON.parse(sessionStorage.getItem('carestanceAuth')||'null');if(!auth?.token)location.replace(location.protocol==='file:'?'../login.html':'/login.html');const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let classId;const headers={Authorization:`Bearer ${auth.token}`,'content-type':'application/json'};const date=v=>v?new Date(v).toLocaleString():'No date';function render(data){$('#tasks').innerHTML=data.tasks.length?data.tasks.map(x=>`<div class="item"><b>${esc(x.title)}</b>${esc(x.type)} · due ${date(x.due_at)}</div>`).join(''):'<p>No tasks yet.</p>';$('#events').innerHTML=data.events.length?data.events.map(x=>`<div class="item"><b>${esc(x.title)}</b>${esc(x.event_type)} · ${date(x.starts_at)}</div>`).join(''):'<p>No events yet.</p>'}async function loadWork(){const r=await fetch(`${api}/api/v1/teacher/classes/${classId}/work`,{headers});const b=await r.json();if(!r.ok)throw Error(b.error);render(b.data)}async function init(){try{const r=await fetch(`${api}/api/v1/teacher/dashboard`,{headers});const b=await r.json();if(!r.ok)throw Error(b.error);$('#classSelect').innerHTML=b.data.availableClasses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');classId=b.data.class.id;$('#classSelect').value=classId;await loadWork()}catch(e){$('#error').textContent=e.message}}$('#classSelect').onchange=async e=>{classId=e.target.value;await loadWork()};async function submit(form,url,body){const r=await fetch(`${api}/api/v1/teacher/classes/${classId}/${url}`,{method:'POST',headers,body:JSON.stringify(body)});const b=await r.json();if(!r.ok)throw Error(b.error);form.reset();await loadWork()}$('#taskForm').onsubmit=async e=>{e.preventDefault();try{await submit(e.target,'tasks',{title:$('#taskTitle').value,type:$('#taskType').value,dueAt:new Date($('#taskDue').value).toISOString()})}catch(x){$('#error').textContent=x.message}};$('#eventForm').onsubmit=async e=>{e.preventDefault();try{await submit(e.target,'events',{title:$('#eventTitle').value,eventType:$('#eventType').value,startsAt:new Date($('#eventStart').value).toISOString()})}catch(x){$('#error').textContent=x.message}};$('#logout').onclick=()=>{sessionStorage.removeItem('carestanceAuth');location.href=location.protocol==='file:'?'../login.html':'/login.html'};init();</script></body></html>
